
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover the fragrance</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">MAISON <span>DE PARFUM.</span></a>
    <a href="index.html" class="back-link">← Back to collection</a>
</header>

<main class="product-page" id="productPage">
    <div class="product-visual">
        <img id="perfumeImage" src="" alt="Perfume bottle">
        <span class="visual-label">THE WINTER EDIT</span>
    </div>

    <div class="product-info">
        <span class="eyebrow">DISCOVER THE FRAGRANCE</span>
        <h1 id="name"></h1>
        <p class="product-description" id="description"></p>

        <div class="tags">
            <span id="use"></span>
            <span id="strength"></span>
        </div>

        <div class="notes">
            <h3>THE FRAGRANCE NOTES</h3>
            <div class="note-row">
                <span>01 / TOP NOTES</span>
                <p id="top"></p>
            </div>
            <div class="note-row">
                <span>02 / HEART NOTES</span>
                <p id="heart"></p>
            </div>
            <div class="note-row">
                <span>03 / BASE NOTES</span>
                <p id="base"></p>
            </div>
        </div>

        <div class="occasion">
            <span class="eyebrow">PERFECT FOR</span>
            <h3 id="occasion"></h3>
        </div>

        <a href="index.html#collection" class="main-button">Explore more fragrances ↗</a>
    </div>
</main>

<footer>
    <a href="index.html" class="logo">MAISON <span>DE PARFUM.</span></a>
    <p>Made with love · Winter Collection 2026</p>
</footer>

<script src="script.js"></script>
</body>
</html>
